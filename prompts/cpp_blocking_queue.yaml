lang: cpp
prompt: |
  Напиши на C++20 header-only потокобезопасную очередь `template<class T> class BlockingQueue` (std::mutex + std::condition_variable):
  `bool push(T v)` — кладёт элемент, возвращает false, если очередь закрыта; `std::optional<T> pop()` — блокируется,
  пока не появится элемент, после close() и опустошения возвращает std::nullopt; `std::optional<T> try_pop()` — не блокируется;
  `void close()` — будит всех ждущих; `size_t size() const`. T может быть move-only.
  Только один блок кода — содержимое заголовка solution.hpp, со всеми #include, без main и пояснений.
files:
  test: |
    #include "solution.hpp"
    #include <cassert>
    #include <memory>
    #include <thread>
    #include <vector>
    #include <atomic>
    int main() {
      BlockingQueue<int> q;
      assert(!q.try_pop().has_value());
      q.push(1); q.push(2); assert(q.size() == 2);
      assert(q.pop().value() == 1); assert(q.try_pop().value() == 2);
      BlockingQueue<std::unique_ptr<int>> mq; mq.push(std::make_unique<int>(7)); assert(**mq.pop() == 7);
      BlockingQueue<int> w; std::atomic<long> sum{0};
      std::vector<std::thread> cons;
      for (int i = 0; i < 4; ++i) cons.emplace_back([&] { while (auto v = w.pop()) sum += *v; });
      std::vector<std::thread> prod;
      for (int p = 0; p < 4; ++p) prod.emplace_back([&] { for (int i = 1; i <= 1000; ++i) w.push(i); });
      for (auto& t : prod) t.join();
      w.close();
      for (auto& t : cons) t.join();
      assert(sum == 4L * 500500);
      assert(!w.push(5));
      assert(!w.pop().has_value());
      return 0;
    }
