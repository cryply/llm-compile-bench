lang: python
prompt: |
  Напиши на Python 3.12 (stdlib only) класс `TTLCache(maxsize: int, ttl: float, clock=time.monotonic)`:
  `set(key, value)` — записать (перезапись ключа обновляет и значение, и срок жизни), `get(key, default=None)` — вернуть
  значение, если оно не протухло (протухшее удаляется), и пометить ключ как недавно использованный; `__len__` — число
  непротухших записей; `__contains__`. Запись протухает, когда clock() >= время записи + ttl.
  При переполнении maxsize сначала удаляются протухшие, затем наименее недавно использованная запись (LRU).
  `clock` — инжектируемая функция для тестов. Только один блок кода, без пояснений и без примеров.
files:
  test: |
    from solution import TTLCache
    def mk(maxsize=2, ttl=10.0):
        t = [0.0]; return TTLCache(maxsize, ttl, clock=lambda: t[0]), t
    def test_expiry():
        c, t = mk()
        c.set("a", 1); assert c.get("a") == 1
        t[0] = 9.99; assert c.get("a") == 1
        t[0] = 10.0; assert c.get("a") is None; assert c.get("a", 7) == 7; assert len(c) == 0
    def test_reset_ttl():
        c, t = mk()
        c.set("a", 1); t[0] = 8; c.set("a", 2); t[0] = 15; assert c.get("a") == 2
    def test_lru():
        c, t = mk()
        c.set("a", 1); c.set("b", 2); c.get("a"); c.set("c", 3)
        assert "a" in c and "c" in c and "b" not in c; assert len(c) == 2
    def test_expired_evicted_first():
        c, t = mk(ttl=5)
        c.set("old", 1); t[0] = 3; c.set("new", 2); c.get("old")
        t[0] = 6; c.set("x", 3)
        assert "new" in c and "x" in c and "old" not in c
    def test_len_skips_expired():
        c, t = mk(maxsize=3)
        c.set("a", 1); t[0] = 5; c.set("b", 2); t[0] = 11
        assert len(c) == 1 and "b" in c
