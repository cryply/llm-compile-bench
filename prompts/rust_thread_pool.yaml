lang: rust
cargo_deps: ""
prompt: |
  Напиши на Rust только на std (без внешних крейтов) пул потоков `pub struct ThreadPool`:
  `pub fn new(size: usize) -> ThreadPool` (panic при 0) запускает size рабочих потоков;
  `pub fn execute<F>(&self, f: F) where F: FnOnce() + Send + 'static` ставит задачу в очередь;
  `impl Drop for ThreadPool` — дожидается выполнения всех уже поставленных задач и join-ит все потоки.
  Задачи должны выполняться параллельно на разных потоках. Верни только один блок кода с содержимым lib.rs, без main и без пояснений.
files:
  test: |
    use bench::*;
    use std::sync::{Arc, atomic::{AtomicUsize, Ordering}};
    use std::time::{Duration, Instant};
    #[test] fn runs_all_before_drop() {
        let n = Arc::new(AtomicUsize::new(0));
        { let p = ThreadPool::new(4);
          for _ in 0..200 { let n = n.clone(); p.execute(move || { std::thread::sleep(Duration::from_micros(200)); n.fetch_add(1, Ordering::SeqCst); }); } }
        assert_eq!(n.load(Ordering::SeqCst), 200);
    }
    #[test] fn parallel() {
        let t0 = Instant::now();
        { let p = ThreadPool::new(4); for _ in 0..4 { p.execute(|| std::thread::sleep(Duration::from_millis(300))); } }
        assert!(t0.elapsed() < Duration::from_millis(900), "not parallel: {:?}", t0.elapsed());
    }
    #[test] #[should_panic] fn zero() { let _ = ThreadPool::new(0); }
