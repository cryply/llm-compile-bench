lang: rust
cargo_deps: ""
prompt: |
  Напиши на Rust без внешних зависимостей публичную функцию `pub fn eval(expr: &str) -> Result<f64, String>` —
  калькулятор арифметических выражений: числа (целые и десятичные, например `2.5`), операторы `+ - * /`, скобки,
  унарный минус (`-3`, `-(1+2)`, `2*-3`), пробелы где угодно. Обычный приоритет, левая ассоциативность (`8-3-2` = 3).
  `Err` на пустой строке, непарных скобках, неизвестных символах, незаконченном выражении (`1 +`) и делении на ноль.
  Верни только один блок кода с содержимым lib.rs, без main и без пояснений.
files:
  test: |
    use bench::*;
    fn ok(s: &str) -> f64 { eval(s).unwrap_or_else(|e| panic!("{s}: {e}")) }
    #[test] fn precedence() { assert_eq!(ok("1 + 2 * 3"), 7.0); assert_eq!(ok("(1+2)*3"), 9.0); }
    #[test] fn left_assoc() { assert_eq!(ok("8-3-2"), 3.0); assert_eq!(ok("16/4/2"), 2.0); }
    #[test] fn decimals() { assert_eq!(ok("10/4"), 2.5); assert_eq!(ok("2.5 * 2"), 5.0); }
    #[test] fn unary() { assert_eq!(ok("-3 + 5"), 2.0); assert_eq!(ok("-(2+3)*2"), -10.0); assert_eq!(ok("2*-3"), -6.0); }
    #[test] fn nested() { assert_eq!(ok("((2))*((3+1))"), 8.0); }
    #[test] fn errors() {
        for s in ["", "   ", "(1+2", "1+2)", "1 $ 2", "1/0", "1 +", "()"] { assert!(eval(s).is_err(), "{s:?} must fail"); }
    }
