# Каждая модель: endpoint (OpenAI-compatible), имя модели в API,
# before/after — shell-команды для поднятия/выгрузки.
# exclusive: true — перед запуском выполняются after всех остальных моделей.
models:
  nemotron35:
    endpoint: http://localhost:11434/v1
    model: hf.co/vcruz305/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF:IQ4_NL
    after:  ["ollama stop hf.co/vcruz305/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF:IQ4_NL"]
  qwen38:
    endpoint: http://localhost:11434/v1
    model: qwen3.8:27b
    after:  ["ollama stop qwen3.8:27b"]
  gptoss:
    endpoint: http://localhost:11434/v1
    model: gpt-oss:120b
    exclusive: true
    after:  ["ollama stop gpt-oss:120b"]
  qwopus36:
    endpoint: http://localhost:11435/v1
    model: qwopus36
    exclusive: true
    before: ["systemctl --user start llama-qwopus"]
    after:  ["systemctl --user stop llama-qwopus"]
  deepseek:
    endpoint: http://localhost:11436/v1
    model: deepseek-v4-flash
    exclusive: true
    before: ["systemctl --user start llama-deepseek"]
    after:  ["systemctl --user stop llama-deepseek"]
    request: { timeout_s: 2700 }   # ~17 tok/s: 32k токенов не влезают в 1800 с

# общие параметры запроса
request:
  temperature: 0.2
  max_tokens: 32000
  timeout_s: 1800

# Once per harness run: stop anything else on the box that might load a
# model while the benchmark is running. On unified-memory machines two large
# models side by side hang the box (this is how run 1 died on 27.10.2026).
# The commands below are the author's own agent timers; replace or delete.
run:
  before: []   # e.g. ["systemctl --user stop my-agent.timer"]
  after:  []   # e.g. ["systemctl --user start my-agent.timer"]
